<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAGICAL.EXE — page not found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="themes.css" />
  <!-- Apply the player's saved palette so the 404 matches the game. -->
  <script>
    try {
      var t = localStorage.getItem("magicalexe.theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <style>
    /* Self-contained centering — token-driven so every theme looks right. */
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .notfound {
      max-width: 34rem;
      text-align: center;
      font-family: var(--font, "JetBrains Mono", monospace);
      color: var(--fg, #e9e4f0);
    }
    .notfound pre {
      color: var(--lilac, #cda9ff);
      text-shadow: 0 0 14px rgba(205, 169, 255, 0.3);
      margin: 0 0 1.25rem;
      line-height: 1.3;
    }
    .notfound h1 { font-size: 1.1rem; font-weight: 700; margin: 0 0 0.5rem; }
    .notfound p { color: var(--muted, #8a8597); margin: 0.4rem 0; }
    .notfound a {
      color: var(--accent, #ff9ec4);
      text-decoration: none;
      border-bottom: 1px solid currentColor;
    }
  </style>
</head>
<body>
  <main class="notfound">
    <pre aria-hidden="true">  ·  ✦  ·
 ( o   o )
  \   ?   /
  ·  ✦  ·</pre>
    <h1>404 — this page slipped into the grey</h1>
    <p>There's nothing here but mist. The path you followed doesn't lead anywhere.</p>
    <p><a href="/">↩ Return to MAGICAL.EXE</a></p>
  </main>
</body>
</html>
