<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="MAGICAL.EXE — a cozy magical-girl terminal RPG">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1730"/>
      <stop offset="1" stop-color="#14101f"/>
    </linearGradient>
    <radialGradient id="og-halo" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#cda9ff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#cda9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="og-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7eb6"/>
      <stop offset="0.5" stop-color="#cda9ff"/>
      <stop offset="1" stop-color="#5fe3c8"/>
    </linearGradient>
    <linearGradient id="og-spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7eb6"/>
      <stop offset="0.5" stop-color="#b48ef0"/>
      <stop offset="1" stop-color="#5fe3c8"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <ellipse cx="600" cy="262" rx="500" ry="170" fill="url(#og-halo)"/>

  <!-- decorative sparkles -->
  <path d="M150 200 Q156.3 224.7 180 230 Q156.3 235.3 150 260 Q143.7 235.3 120 230 Q143.7 224.7 150 200 Z" fill="url(#og-spark)" opacity="0.85"/>
  <path d="M1050 380 Q1054.5 396.6 1070 400 Q1054.5 403.4 1050 420 Q1045.5 403.4 1030 400 Q1045.5 396.6 1050 380 Z" fill="#5fe3c8" opacity="0.85"/>
  <circle cx="200" cy="450" r="3.6" fill="#ffb27e"/>
  <circle cx="970" cy="180" r="3" fill="#ff7eb6"/>
  <circle cx="1090" cy="240" r="2.4" fill="#ffd479"/>
  <circle cx="120" cy="380" r="2.4" fill="#cda9ff"/>

  <!-- window dots — a nod to the terminal frame -->
  <circle cx="280" cy="240" r="11" fill="#ff7eb6"/>
  <circle cx="312" cy="240" r="11" fill="#ffb27e"/>
  <circle cx="344" cy="240" r="11" fill="#5fe3c8"/>

  <!-- main sparkle to the left of the wordmark -->
  <path d="M250 320 Q260 360 300 370 Q260 380 250 420 Q240 380 200 370 Q240 360 250 320 Z" fill="url(#og-spark)"/>

  <!-- wordmark, centered, in JetBrains Mono -->
  <!-- Two adjacent <text> elements (CoreSVG honors fill on <text>, not on <tspan>);
       MAGICAL pink-leaning, .EXE faded lilac to land on the brand's titlebar look. -->
  <text x="510" y="345" text-anchor="end" fill="#ff9ad1"
        font-family="'JetBrains Mono','SF Mono','Menlo','Courier New',monospace"
        font-size="112" font-weight="700" letter-spacing="4">MAGICAL</text>
  <text x="520" y="345" text-anchor="start" fill="#cda9ff" fill-opacity="0.82"
        font-family="'JetBrains Mono','SF Mono','Menlo','Courier New',monospace"
        font-size="112" font-weight="700" letter-spacing="4">.EXE</text>

  <!-- trailing sparkle -->
  <path d="M950 320 Q960 360 1000 370 Q960 380 950 420 Q940 380 900 370 Q940 360 950 320 Z" fill="url(#og-spark)"/>

  <!-- tagline -->
  <text x="600" y="430" text-anchor="middle"
        font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,monospace"
        font-size="28" letter-spacing="2" fill="#cda9ff" opacity="0.95">
    a cozy magical-girl terminal RPG
  </text>

  <!-- url -->
  <text x="600" y="500" text-anchor="middle"
        font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,monospace"
        font-size="22" letter-spacing="3" fill="#6f6594">
    magical-exe.redmint.studio
  </text>

  <!-- author line -->
  <text x="600" y="560" text-anchor="middle"
        font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,monospace"
        font-size="16" letter-spacing="2" fill="#a99fce" opacity="0.65">
    a Red Mint Studio game
  </text>
</svg>
