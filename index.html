<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAGICAL.EXE</title>
  <!-- Favicon: SVG primary (crisp at any size), PNG fallbacks for older browsers + iOS -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#1c1730" />
  <!-- Locked game font: JetBrains Mono (handles the mascots.md Unicode glyphs).
       monospace fallback keeps things sane if the CDN is unreachable. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="themes.css" />
</head>
<body>
  <!-- The fake-terminal "window". Plain DOM, styled with CSS to look terminal-y.
       NOT xterm.js, NOT a real emulator. -->
  <main class="screen" role="application" aria-label="MAGICAL.EXE terminal">
    <!-- Title / chrome bar -->
    <header class="titlebar">
      <span class="dot dot--pink" aria-hidden="true"></span>
      <span class="dot dot--peach" aria-hidden="true"></span>
      <span class="dot dot--teal" aria-hidden="true"></span>
      <span class="titlebar__name">✦ MAGICAL.EXE ✦</span>
      <div class="titlebar__right">
        <span class="titlebar__hint">v1.0.0 · terminal shell</span>
        <!-- Background-music control (wired by main.js → music.js) -->
        <div class="music" role="group" aria-label="Music">
          <div class="music__title" id="music-title" hidden aria-hidden="true">
            <span class="music__title-inner"></span>
          </div>
          <button
            id="music-toggle"
            class="music__toggle"
            type="button"
            aria-pressed="true"
            title="Toggle music"
          >♪</button>
          <input
            id="music-volume"
            class="music__volume"
            type="range"
            min="0" max="100" value="50" step="1"
            aria-label="Music volume"
            title="Music volume"
          />
        </div>
        <!-- Settings — opens the same menu the `settings` command does. -->
        <button
          id="settings-btn"
          class="settings-btn"
          type="button"
          aria-label="Settings"
          title="Settings (theme · text speed · music · difficulty)"
        >⚙</button>
      </div>
    </header>

    <!-- hud-hidden: STATUS + MASCOT stay hidden until the player meets their
         mascot (character.created). render.js manages this class. -->
    <div class="layout hud-hidden" data-mobile-tab="terminal">
      <!-- Mobile tab bar (hidden on desktop; appears once HUD reveals) -->
      <nav class="mobile-tabs" aria-label="View tabs">
        <button class="mobile-tabs__tab mobile-tabs__tab--active" data-tab="terminal" type="button">PLAY</button>
        <button class="mobile-tabs__tab" data-tab="status" type="button">STATUS</button>
      </nav>

      <!-- REGION 1: terminal (scrollback + input) -->
      <section class="terminal" aria-label="Game output">
        <div id="output" class="output" aria-live="polite" tabindex="0"></div>
        <div id="menu" class="menu" role="listbox" aria-label="Choose an option" hidden></div>
        <div id="example-prompt" class="example-prompt" aria-hidden="true"></div>
        <!-- Human-check (Turnstile) mount. Lives OUTSIDE #output so the append-only
             scrollback reconciliation never disturbs the live widget. Shown by main.js
             only on first AI use; hidden otherwise. -->
        <div id="captcha" class="captcha" hidden>
          <p class="captcha__label">// a quick human check before the magic…</p>
          <div id="captcha-widget" class="captcha__widget"></div>
        </div>
        <form id="input-form" class="inputline" autocomplete="off">
          <label class="prompt" for="input" aria-hidden="true">&gt;</label>
          <input
            id="input"
            class="inputline__field"
            type="text"
            name="command"
            placeholder="type a command…"
            aria-label="Command input"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
          />
        </form>
      </section>

      <!-- REGIONS 2 & 3: persistent panels (empty placeholders for now) -->
      <aside class="panels" aria-label="Status panels">
        <!-- REGION 2: stat panel -->
        <section class="panel panel--stats" aria-label="Stats">
          <h2 class="panel__title">STATUS</h2>
          <!-- painted by render.js (renderStats) -->
          <div id="stat-panel" class="panel__body"></div>
        </section>

        <!-- REGION 3: magical-companion panel -->
        <section class="panel panel--mascot" aria-label="Magical companion">
          <h2 class="panel__title">MAGICAL COMPANION</h2>
          <!-- painted by render.js (renderMascot) -->
          <div id="mascot-panel" class="panel__body"></div>
        </section>
      </aside>
    </div>
  </main>

  <!-- Persistent support link, pinned in the margin below the terminal window.
       Themed via tokens so it adapts across all palettes; opens Ko-fi in a new tab. -->
  <a
    class="kofi"
    href="https://ko-fi.com/shirleyleng"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Support Red Mint Studio on Ko-fi"
  >♥ Support on Ko-fi</a>

  <script type="module" src="src/main.js"></script>
</body>
</html>
