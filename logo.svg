<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200" role="img" aria-label="MAGICAL.EXE logo">
  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7eb6"/>
      <stop offset="0.5" stop-color="#cda9ff"/>
      <stop offset="1" stop-color="#5fe3c8"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7eb6"/>
      <stop offset="0.5" stop-color="#b48ef0"/>
      <stop offset="1" stop-color="#5fe3c8"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cda9ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#cda9ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="textglow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ambient halo -->
  <ellipse cx="380" cy="100" rx="320" ry="70" fill="url(#halo)"/>

  <!-- window dots (titlebar nod) -->
  <circle cx="70"  cy="44" r="7" fill="#ff7eb6"/>
  <circle cx="92"  cy="44" r="7" fill="#ffb27e"/>
  <circle cx="114" cy="44" r="7" fill="#5fe3c8"/>

  <!-- leading sparkle -->
  <path d="M60 96 Q66.3 122.7 93 127 Q66.3 131.3 60 158 Q53.7 131.3 27 127 Q53.7 122.7 60 96 Z" fill="url(#star)"/>

  <!-- wordmark -->
  <text x="118" y="150" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,monospace"
        font-size="78" font-weight="700" letter-spacing="2" filter="url(#textglow)">
    <tspan fill="url(#word)">MAGICAL</tspan><tspan fill="#cda9ff" fill-opacity="0.78">.EXE</tspan>
  </text>

  <!-- trailing sparkles -->
  <path d="M712 86 Q715.5 100.6 730 104 Q715.5 107.4 712 122 Q708.5 107.4 694 104 Q708.5 100.6 712 86 Z" fill="#5fe3c8"/>
  <circle cx="690" cy="150" r="2.6" fill="#ffb27e"/>
</svg>
